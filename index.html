/* ====== BROSUR CACHE ====== */
let brosurCache = {};
async function loadBrosurData() {
  try {
    const snap = await db.collection("brosur").get();
    snap.forEach(doc => { brosurCache[doc.id] = doc.data(); });
    console.log("Brosur loaded:", Object.keys(brosurCache).length);
  } catch(e) { console.warn("Firestore:", e.message); }
}
function getBrosur(mkId, mdId, gen) {
  const key = mkId + "-" + mdId + "-" + gen.replace(/[^a-zA-Z0-9]/g, "_");
  return brosurCache[key] || null;
}
function genBrosurData(mkId, mdId, units) {
  for (const u of units) { const b = getBrosur(mkId, mdId, u.generasi); if (b) return b; }
  return null;
}

/* ====== UTILITAS ====== */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function tahunMulai(t) { const m = String(t).match(/\d{4}/); return m ? +m[0] : 0; }

function getGenerasiList(units) {
  const map = new Map();
  units.forEach(u => {
    if (!map.has(u.generasi)) map.set(u.generasi, { nama: u.generasi, perubahan: u.perubahan, units: [], tahunMin: 9999, tahunMax: 0 });
    const g = map.get(u.generasi); g.units.push(u);
    const t = tahunMulai(u.tahun);
    if (t && t < g.tahunMin) g.tahunMin = t;
    if (t && t > g.tahunMax) g.tahunMax = t;
  });
  return [...map.values()].sort((a, b) => a.tahunMin - b.tahunMin);
}
function groupVariants(units) {
  const map = new Map();
  units.forEach(u => {
    const key = [u.tipe_unit, u.tahun, u.generasi, u.perubahan, u.catatan].join("\0");
    if (!map.has(key)) map.set(key, { ...u, transmisiList: [] });
    const g = map.get(key);
    if (u.transmisi && u.transmisi !== "-" && !g.transmisiList.includes(u.transmisi)) g.transmisiList.push(u.transmisi);
  });
  return [...map.values()];
}

/* ====== DROPDOWNS ====== */
const merekSel = $("merekSel"), modelSel = $("modelSel");
MEREK_LIST.forEach(m => { const o = document.createElement("option"); o.value = m.id; o.textContent = m.nama + " (" + m.model.length + ")"; merekSel.appendChild(o); });
merekSel.onchange = () => {
  const mk = MEREK_LIST.find(m => m.id === merekSel.value);
  modelSel.innerHTML = '<option value="">Pilih model\u2026</option>'; modelSel.disabled = !mk || !mk.model.length;
  if (mk) mk.model.forEach(md => { const o = document.createElement("option"); o.value = md.id; o.textContent = md.nama + " (" + groupVariants(md.unit).length + ")"; modelSel.appendChild(o); });
  showWelcome(); updateHash();
};
modelSel.onchange = () => { if (!modelSel.value) { showWelcome(); return; } renderModel(); updateHash(); };
function showWelcome() { $("welcomeState").style.display = ""; $("content").style.display = "none"; }

(function() {
  const all = []; MEREK_LIST.forEach(mk => mk.model.forEach(md => md.unit.forEach(u => all.push(u))));
  $("welcomeStats").innerHTML = '<span class="wstat"><b>' + MEREK_LIST.length + '</b>merek</span><span class="wstat"><b>' + MEREK_LIST.reduce((a, m) => a + m.model.length, 0) + '</b>model</span><span class="wstat"><b>' + groupVariants(all).length + '</b>varian</span>';
})();

/* ====== RENDER ====== */
function renderModel() {
  const mk = MEREK_LIST.find(m => m.id === merekSel.value), md = mk?.model.find(m => m.id === modelSel.value);
  if (!mk || !md) return;
  $("welcomeState").style.display = "none"; $("content").style.display = ""; $("searchInput").value = "";
  const gens = getGenerasiList(md.unit), tv = groupVariants(md.unit).length;
  const last = gens[gens.length-1], end = last.units.some(u => u.tahun.includes("sekarang")) ? "sekarang" : last.tahunMax;
  $("modelHeader").innerHTML = '<div class="model-brand">' + esc(mk.nama) + '</div><h2>' + esc(md.nama) + '</h2><div class="model-stats"><span class="model-stat"><b>' + gens.length + '</b> generasi</span><span class="model-stat"><b>' + tv + '</b> varian</span><span class="model-stat"><b>' + gens[0].tahunMin + '</b>\u2013<b>' + end + '</b></span></div>';
  renderTimeline(mk, md, gens);
}

function renderTimeline(mk, md, gens, query) {
  const tl = $("timeline"); tl.innerHTML = ""; let vis = 0;
  gens.forEach((gen, i) => {
    let vars = groupVariants(gen.units);
    if (query) { const q = query.toLowerCase(); vars = vars.filter(v => q.split(/\s+/).every(k => [v.tipe_unit, v.transmisiList.join(" "), v.tahun, v.generasi, v.perubahan, v.catatan].join(" ").toLowerCase().includes(k))); if (!vars.length) return; }
    vis++;
    const isOpen = !query && i === 0, bros = genBrosurData(mk.id, md.id, gen.units);
    const yr = gen.tahunMin + (gen.tahunMax !== gen.tahunMin ? "\u2013" + gen.tahunMax : "") + (gen.units.some(u => u.tahun.includes("sekarang")) ? "+" : "");
    let desc = esc(gen.perubahan);
    if (bros) desc += '<button type="button" class="bros-btn" data-bg="1"><span style="font-size:20px">📄</span><span><span class="bros-t">' + esc(bros.judul) + '</span><span class="bros-s">PDF brosur</span></span></button>';

    let uploadBtnHTML = '';
    if (isAdmin && !bros) uploadBtnHTML = '<div style="padding:12px 18px;border-top:1px solid var(--line)"><button type="button" class="bros-btn" data-upload="1" style="background:#fffbeb;border-color:#fde68a;margin:0;width:100%;justify-content:center"><span class="bros-t" style="color:#92400e">📁 + Tambah Brosur PDF</span></button></div>';

    const sec = document.createElement("div"); sec.className = "gen-section";
    sec.innerHTML = '<div class="gen-block"><div class="gen-dot' + (isOpen ? "" : " inactive") + '"></div><div class="gen-card' + (isOpen ? " open" : "") + '"><div class="gen-head"><div class="gen-info"><div class="gen-name">' + esc(gen.nama) + '</div><div class="gen-years">' + esc(yr) + '</div></div><div class="gen-badges">' + (bros ? '<span class="gen-count" style="background:#f0fdf4;color:#16a34a;border-color:#bbf7d0">📄</span>' : '') + (isAdmin && !bros ? '<span class="gen-count" style="background:#fffbeb;color:#92400e;border-color:#fde68a;cursor:pointer" data-upload-badge="1">+ PDF</span>' : '') + '<span class="gen-count">' + vars.length + ' varian</span><span class="gen-caret">\u25BC</span></div></div><div class="gen-desc">' + desc + '</div><div class="gen-variants">' + vars.map((v, vi) => '<div class="var-item" data-vi="' + vi + '"><div class="var-top"><div class="var-name">' + esc(v.tipe_unit) + '</div><div class="var-badges">' + v.transmisiList.map(t => '<span class="bdg bdg-tr">' + esc(t) + '</span>').join("") + '<span class="bdg bdg-year">' + esc(v.tahun) + '</span></div></div>' + (v.catatan ? '<div class="var-note">' + esc(v.catatan) + '</div>' : '') + '</div>').join("") + uploadBtnHTML + '</div></div></div>';

    sec.querySelector(".gen-head").onclick = (e) => { if (e.target.closest("[data-upload-badge]")) return; const c = sec.querySelector(".gen-card"), d = sec.querySelector(".gen-dot"); c.classList.toggle("open"); d.classList.toggle("inactive", !c.classList.contains("open")); };
    const bb = sec.querySelector("[data-bg]"); if (bb && bros) bb.onclick = e => { e.stopPropagation(); openBrosur(bros); };
    const ubB = sec.querySelector("[data-upload-badge]"); if (ubB) ubB.onclick = e => { e.stopPropagation(); openAdminForGen(mk.id, md.id, gen.nama); };
    const ub = sec.querySelector("[data-upload]"); if (ub) ub.onclick = e => { e.stopPropagation(); openAdminForGen(mk.id, md.id, gen.nama); };
    sec.querySelectorAll("[data-vi]").forEach(el => { el.onclick = () => { const vi = parseInt(el.dataset.vi, 10); if (vars[vi]) openDetail(mk, md, vars[vi]); }; });
    tl.appendChild(sec);
  });
  if (!vis) tl.innerHTML = '<div class="welcome" style="padding:40px 20px"><span class="icon">\ud83d\udd0d</span><h2>Tidak ditemukan</h2><p>Coba kata kunci lain</p></div>';
}

let st; $("searchInput").addEventListener("input", e => { clearTimeout(st); st = setTimeout(() => { const mk = MEREK_LIST.find(m => m.id === merekSel.value), md = mk?.model.find(m => m.id === modelSel.value); if (mk && md) renderTimeline(mk, md, getGenerasiList(md.unit), e.target.value.trim()); }, 180); });

/* ====== DETAIL ====== */
function openDetail(mk, md, v) {
  const bros = getBrosur(mk.id, md.id, v.generasi);
  let bh = '';
  if (bros) bh = '<div class="detail-section"><div class="detail-label">Dokumen</div><button type="button" class="bros-btn" id="detBros"><span style="font-size:20px">📄</span><span><span class="bros-t">' + esc(bros.judul) + '</span><span class="bros-s">PDF brosur</span></span></button></div>';
  $("detailModal").innerHTML = '<div class="modal-head"><div><h2>' + esc(v.tipe_unit) + '</h2><div class="sub">' + esc(mk.nama) + ' ' + esc(md.nama) + ' \u00B7 ' + esc(v.generasi) + '</div></div><button class="close-btn" type="button" id="closeDetail">\u2715</button></div><div class="modal-body"><div class="detail-specs"><div class="spec-box"><div class="detail-label">Tahun Edar</div><div class="val">' + esc(String(v.tahun).split("-")[0]) + '</div><div class="sub-val">' + esc(v.tahun) + '</div></div><div class="spec-box"><div class="detail-label">Transmisi</div><div class="val">' + (v.transmisiList.length ? esc(v.transmisiList.join(" / ")) : "\u2014") + '</div></div></div><div class="detail-section" style="margin-top:16px"><div class="detail-label">Perubahan pada generasi ini</div><div class="detail-value">' + (esc(v.perubahan) || "\u2014") + '</div></div>' + (v.catatan ? '<div class="detail-section"><div class="detail-highlight"><div class="detail-label">\ud83d\udca1 Pembeda di Lapangan</div><div class="detail-value">' + esc(v.catatan) + '</div></div></div>' : '') + bh + '</div>';
  $("closeDetail").onclick = () => closeOverlay("detailOverlay");
  if (bros) $("detBros").onclick = () => { closeOverlay("detailOverlay"); setTimeout(() => openBrosur(bros), 200); };
  openOverlay("detailOverlay");
}

/* ====== PDF VIEWER ====== */
function openBrosur(b) {
  const pdfUrl = b.pdfPath;
  $("brosModal").innerHTML =
    '<div class="bros-head"><div><div class="ttl">' + esc(b.judul) + '</div><div class="sb">PDF brosur</div></div>' +
    '<div class="bros-tools"><a class="bros-dl" href="' + esc(pdfUrl) + '" target="_blank">📄 Buka PDF</a>' +
    '<a class="bros-dl" href="' + esc(pdfUrl) + '" download>⬇ Download</a>' +
    '<button class="close-btn" type="button" id="closeBros">\u2715</button></div></div>' +
    '<div class="bros-stage"><iframe src="' + esc(pdfUrl) + '" title="' + esc(b.judul) + '"></iframe>' +
    '<div class="bros-fallback"><span class="fb-icon">📄</span><h3>' + esc(b.judul) + '</h3>' +
    '<p>Preview PDF tidak tersedia di browser HP</p>' +
    '<a class="bros-dl" href="' + esc(pdfUrl) + '" target="_blank">📄 Buka PDF</a>' +
    '&nbsp; <a class="bros-dl" href="' + esc(pdfUrl) + '" download>⬇ Download</a></div></div>';
  $("closeBros").onclick = () => closeOverlay("brosOverlay");
  openOverlay("brosOverlay");
}

/* ====== ADMIN ====== */
let isAdmin = false;
function toggleAdmin() { isAdmin = !isAdmin; $("adminBar").classList.toggle("show", isAdmin); if (modelSel.value) renderModel(); }

function openAdmin() { openAdminForGen("", "", ""); }
function openAdminForGen(merekId, modelId, generasi) {
  const modal = $("adminModal");
  let mOpts = '<option value="">Pilih merek…</option>';
  MEREK_LIST.forEach(m => mOpts += '<option value="' + m.id + '"' + (m.id === merekId ? ' selected' : '') + '>' + esc(m.nama) + '</option>');

  modal.innerHTML = '<div class="modal-head"><div><h2>Tambah Brosur PDF</h2><div class="sub">Link ke file PDF di folder brosur/</div></div><button class="close-btn" type="button" id="closeAdmin">\u2715</button></div><div class="modal-body">' +
    '<div class="adm-field"><label>Merek</label><select id="admMerek">' + mOpts + '</select></div>' +
    '<div class="adm-field"><label>Model</label><select id="admModel" disabled><option value="">Pilih model…</option></select></div>' +
    '<div class="adm-field"><label>Generasi</label><select id="admGen" disabled><option value="">Pilih generasi…</option></select></div>' +
    '<div class="adm-field"><label>Judul Brosur</label><input type="text" id="admJudul" placeholder="contoh: Brosur New Honda Brio 2023"></div>' +
    '<div class="adm-field"><label>Nama File PDF</label><input type="text" id="admPdf" placeholder="contoh: honda-brio-2023.pdf"><div class="adm-hint">File PDF harus sudah ada di folder <b>brosur/</b> di repo GitHub</div></div>' +
    '<button class="adm-btn" id="admSubmit" disabled>Simpan ke Firestore</button>' +
    '<div class="adm-ok" id="admOk"></div>' +
    '<div id="admList" style="margin-top:20px"></div></div>';

  $("closeAdmin").onclick = () => closeOverlay("adminOverlay");
  const admMerek = $("admMerek"), admModel = $("admModel"), admGen = $("admGen");

  admMerek.onchange = () => {
    const mk = MEREK_LIST.find(m => m.id === admMerek.value);
    admModel.innerHTML = '<option value="">Pilih model…</option>'; admModel.disabled = !mk;
    admGen.innerHTML = '<option value="">Pilih generasi…</option>'; admGen.disabled = true;
    if (mk) mk.model.forEach(md => { const o = document.createElement("option"); o.value = md.id; o.textContent = md.nama; admModel.appendChild(o); });
    checkReady();
  };
  admModel.onchange = () => {
    const mk = MEREK_LIST.find(m => m.id === admMerek.value), md = mk?.model.find(m => m.id === admModel.value);
    admGen.innerHTML = '<option value="">Pilih generasi…</option>'; admGen.disabled = !md;
    if (md) getGenerasiList(md.unit).forEach(g => { const o = document.createElement("option"); o.value = g.nama; o.textContent = g.nama; admGen.appendChild(o); });
    checkReady();
  };
  admGen.onchange = checkReady;
  $("admPdf").oninput = checkReady;

  if (merekId) { admMerek.value = merekId; admMerek.onchange(); if (modelId) { admModel.value = modelId; admModel.onchange(); } if (generasi) { admGen.value = generasi; } checkReady(); }

  function checkReady() { $("admSubmit").disabled = !admMerek.value || !admModel.value || !admGen.value || !$("admPdf").value.trim(); }

  $("admSubmit").onclick = async () => {
    const mkId = admMerek.value, mdId = admModel.value, genNama = admGen.value;
    const judul = $("admJudul").value.trim() || ("Brosur " + genNama);
    const pdfFile = $("admPdf").value.trim();
    const pdfPath = "brosur/" + pdfFile;
    const docId = mkId + "-" + mdId + "-" + genNama.replace(/[^a-zA-Z0-9]/g, "_");

    $("admSubmit").disabled = true;
    try {
      await db.collection("brosur").doc(docId).set({
        merek: mkId, model: mdId, generasi: genNama, judul, pdfPath,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      brosurCache[docId] = { merek: mkId, model: mdId, generasi: genNama, judul, pdfPath };
      $("admOk").style.display = "block";
      $("admOk").textContent = "\u2705 Tersimpan! Brosur \"" + judul + "\" terhubung ke " + pdfPath;
      $("admPdf").value = "";
      if (merekSel.value === mkId && modelSel.value === mdId) renderModel();
      loadAdmList();
    } catch (err) {
      $("admOk").style.display = "block";
      $("admOk").textContent = "\u274C Error: " + err.message;
      $("admOk").style.background = "var(--red-soft)"; $("admOk").style.color = "var(--red)";
    }
    $("admSubmit").disabled = false;
  };

  loadAdmList();
  openOverlay("adminOverlay");
}

function loadAdmList() {
  const list = $("admList"); if (!list) return;
  const items = Object.entries(brosurCache);
  if (!items.length) { list.innerHTML = '<p style="font-size:13px;color:var(--text-3);text-align:center;padding:12px">Belum ada brosur</p>'; return; }
  list.innerHTML = '<div class="detail-label">Brosur yang sudah terdaftar</div>' +
    items.map(([id, b]) => '<div class="adm-item"><div><div class="ai-t">' + esc(b.judul) + '</div><div class="ai-s">' + esc(b.pdfPath || '-') + '</div></div><button class="ai-del" data-del="' + id + '">Hapus</button></div>').join("");
  list.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Hapus brosur ini?")) return;
      try { await db.collection("brosur").doc(btn.dataset.del).delete(); delete brosurCache[btn.dataset.del]; loadAdmList(); if (modelSel.value) renderModel(); } catch (e) { alert("Error: " + e.message); }
    };
  });
}

/* ====== OVERLAY ====== */
let lastFocused = null;
function openOverlay(id) { lastFocused = document.activeElement; $(id).classList.add("show"); document.body.classList.add("modal-open"); }
function closeOverlay(id) { $(id).classList.remove("show"); if (!document.querySelector(".overlay.show")) document.body.classList.remove("modal-open"); if (lastFocused && document.contains(lastFocused)) lastFocused.focus(); }
["detailOverlay", "brosOverlay", "adminOverlay"].forEach(id => { $(id).addEventListener("mousedown", e => { if (e.target === e.currentTarget) closeOverlay(id); }); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const ov = document.querySelector(".overlay.show"); if (ov) closeOverlay(ov.id); } });

/* ====== HASH ====== */
let igh = false;
function updateHash() { if (!merekSel.value) { if (location.hash) { igh = true; location.hash = ""; setTimeout(() => igh = false, 0); } return; } const h = merekSel.value + (modelSel.value ? "/" + modelSel.value : ""); if (location.hash.replace(/^#/, "") === h) return; igh = true; location.hash = h; setTimeout(() => igh = false, 0); }
function readHash() { const h = location.hash.replace(/^#/, ""); if (!h) return false; const [mk, md] = h.split("/"); if (!mk) return false; merekSel.value = mk; merekSel.onchange(); if (md) { modelSel.value = md; renderModel(); } return true; }
window.addEventListener("hashchange", () => { if (!igh) readHash(); });

loadBrosurData().then(() => { readHash(); });
</script>
</body>
</html>

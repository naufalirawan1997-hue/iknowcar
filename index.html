<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IKnow Car — Referensi Varian Mobil Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-hover: #fafbfc;
  --line: #e1e4e8;
  --line-2: #959da5;
  --text: #1b1f23;
  --text-2: #586069;
  --text-3: #959da5;
  --accent: #0366d6;
  --accent-dark: #044289;
  --accent-soft: #f1f8ff;
  --accent-line: #c8e1ff;
  --green: #22863a;
  --green-soft: #f0fff4;
  --green-line: #bef5cb;
  --amber: #b08800;
  --amber-soft: #fffdef;
  --amber-line: #ffe58f;
  --red: #cb2431;
  --red-soft: #ffeef0;
  --r: 8px;
  --r-md: 10px;
  --shadow-sm: 0 1px 2px rgba(27,31,35,.07);
  --shadow: 0 1px 3px rgba(27,31,35,.1), 0 1px 2px rgba(27,31,35,.06);
  --shadow-lg: 0 3px 12px rgba(27,31,35,.15);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px; line-height: 1.55;
  min-height: 100dvh; -webkit-font-smoothing: antialiased;
}
body.no-scroll { overflow: hidden; }

/* ── NAV ── */
.nav {
  background: var(--text); color: #fff;
  padding: 0 20px; height: 52px;
  display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 40;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.nav-logo {
  font-size: 16px; font-weight: 800; letter-spacing: -.03em;
  display: flex; align-items: center; gap: 8px;
  white-space: nowrap;
}
.nav-logo .mark {
  background: var(--accent); width: 28px; height: 28px;
  border-radius: 6px; display: grid; place-items: center;
  font-size: 13px; font-weight: 800;
}
.nav-logo .logotype span { font-weight: 400; opacity: .55; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.nav-admin {
  background: none; border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.5);
  border-radius: 5px; padding: 4px 8px; font-family: inherit; font-size: 11px;
  cursor: pointer; font-weight: 600;
}
.nav-admin:hover { color: #fff; border-color: rgba(255,255,255,.5); }
.nav-admin.on { background: #e36209; border-color: #e36209; color: #fff; }

/* ── SELECTOR BAR ── */
.sel-bar {
  background: #24292e; padding: 14px 20px 16px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sel-bar-inner { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sf { position: relative; }
.sf label { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #959da5; margin-bottom: 4px; }
.sf select {
  width: 100%; appearance: none; font-family: inherit;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px; color: #e1e4e8; font-size: 14px; font-weight: 600;
  padding: 10px 34px 10px 12px; cursor: pointer;
}
.sf select:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,.1); }
.sf select:disabled { opacity: .3; cursor: default; }
.sf::after {
  content: ""; position: absolute; right: 13px; bottom: 15px;
  width: 6px; height: 6px; border-right: 1.5px solid #959da5; border-bottom: 1.5px solid #959da5;
  transform: rotate(45deg); pointer-events: none;
}
.sf select option { color: var(--text); background: #fff; }

/* Custom merek dropdown with logos */
.cd { position: relative; }
.cd-trigger {
  width: 100%; display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
  border-radius: 6px; color: #e1e4e8; font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 10px 34px 10px 12px; cursor: pointer; min-height: 40px; text-align: left;
}
.cd-trigger:hover { background: rgba(255,255,255,.1); }
.cd-trigger.open { border-color: var(--accent); background: rgba(255,255,255,.1); }
.cd-trigger .cd-logo { width: 22px; height: 22px; border-radius: 4px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.cd-trigger .cd-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.cd-trigger .cd-ph { color: #959da5; }
.cd-arrow { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.cd-arrow::after { content: ""; display: block; width: 6px; height: 6px; border-right: 1.5px solid #959da5; border-bottom: 1.5px solid #959da5; transform: rotate(45deg); }

.cd-menu {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: var(--shadow-lg); z-index: 60; max-height: 320px; overflow-y: auto;
  padding: 4px;
}
.cd-menu.show { display: block; }
.cd-opt {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  cursor: pointer; border-radius: 6px; font-size: 13px; font-weight: 600;
  color: var(--text); transition: background .1s;
}
.cd-opt:hover { background: var(--accent-soft); }
.cd-opt.active { background: var(--accent-soft); color: var(--accent); }
.cd-opt .cd-o-logo {
  width: 28px; height: 28px; border-radius: 6px; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border: 1px solid var(--line);
}
.cd-opt .cd-o-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.cd-opt .cd-o-init {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
  display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line);
  font-size: 10px; font-weight: 800; color: var(--text-3);
}
.cd-opt .cd-o-name { flex: 1; }
.cd-opt .cd-o-count { font-size: 11px; color: var(--text-3); font-weight: 500; }

/* ── MAIN ── */
.main { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

/* ── WELCOME ── */
.welcome { padding: 56px 20px; text-align: center; }
.welcome h2 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; color: var(--text); margin-bottom: 6px; }
.welcome p { font-size: 14px; color: var(--text-2); max-width: 380px; margin: 0 auto; }
.welcome .stats { display: flex; gap: 0; justify-content: center; margin-top: 32px; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); box-shadow: var(--shadow-sm); max-width: 400px; margin-left: auto; margin-right: auto; }
.welcome .st { flex: 1; padding: 16px 8px; text-align: center; border-right: 1px solid var(--line); }
.welcome .st:last-child { border-right: none; }
.welcome .st b { display: block; font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.welcome .st span { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* ── MODEL HEADER ── */
.mh {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 18px 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
}
.mh-info {}
.mh-brand { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 2px; }
.mh h2 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; text-transform: uppercase; line-height: 1; }
.mh-stats { display: flex; gap: 12px; margin-top: 10px; }
.mh-stat { font-size: 12px; color: var(--text-2); }
.mh-stat b { font-weight: 700; color: var(--text); }
.mh-back {
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  width: 36px; height: 36px; display: grid; place-items: center;
  cursor: pointer; font-size: 16px; color: var(--text-2); flex-shrink: 0;
}
.mh-back:hover { background: var(--red-soft); border-color: #fdaeb7; color: var(--red); }

/* ── SEARCH ── */
.search-box { position: relative; margin-bottom: 12px; }
.search-box input {
  width: 100%; font-family: inherit; font-size: 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 10px 14px 10px 38px;
  color: var(--text); box-shadow: var(--shadow-sm);
}
.search-box input::placeholder { color: var(--text-3); }
.search-box input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(3,102,214,.15); }
.search-box .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 14px; pointer-events: none; }

/* ── TIMELINE ── */
.tl-section { position: relative; margin-bottom: 4px; }
.tl-section::before {
  content: ""; position: absolute; left: 15px; top: 0; bottom: 0;
  width: 2px; background: var(--line-2); opacity: .45;
}
.tl-section:last-child::before { bottom: 50%; }
.tl-block { position: relative; padding-left: 42px; padding-bottom: 4px; }
.tl-dot {
  position: absolute; left: 9px; top: 18px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); z-index: 1;
}
.tl-dot.off { background: var(--line-2); }

.tl-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden;
}
.tl-head {
  padding: 12px 14px; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  user-select: none;
}
.tl-head:hover { background: var(--surface-hover); }
.tl-head:active { background: var(--bg); }
.tl-info { flex: 1; min-width: 0; }
.tl-name { font-size: 14px; font-weight: 700; color: var(--text); }
.tl-yr { font-size: 11.5px; color: var(--text-3); font-weight: 500; margin-top: 1px; }
.tl-tags { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
.tl-tag {
  font-size: 10.5px; font-weight: 700; border-radius: 20px;
  padding: 2px 9px; white-space: nowrap;
  background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line);
}
.tl-tag.doc { background: var(--green-soft); color: var(--green); border-color: var(--green-line); }
.tl-tag.adm { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-line); cursor: pointer; }
.tl-arr {
  font-size: 10px; color: var(--text-3); transition: transform .15s;
  width: 20px; text-align: center;
}
.tl-card.open .tl-arr { transform: rotate(180deg); }

.tl-desc {
  padding: 0 14px 12px; font-size: 13px; color: var(--text-2); line-height: 1.6;
  border-bottom: 1px solid var(--line); display: none;
}
.tl-card.open .tl-desc { display: block; }
.tl-body { display: none; }
.tl-card.open .tl-body { display: block; }

/* ── BROSUR BTN ── */
.pdf-btn {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 6px;
  padding: 8px 14px; font-family: inherit; text-align: left; margin-top: 10px;
}
.pdf-btn:hover { border-color: var(--accent); background: #ddeeff; }
.pdf-btn svg { flex-shrink: 0; }
.pdf-btn .pt { font-size: 12.5px; font-weight: 700; color: var(--accent-dark); }
.pdf-btn .ps { font-size: 11px; color: var(--text-2); }

/* ── VARIANT ── */
.vi {
  padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.vi:last-child { border-bottom: none; }
.vi:hover { background: var(--surface-hover); }
.vi-name { font-size: 13.5px; font-weight: 700; text-transform: uppercase; letter-spacing: -.01em; }
.vi-tags { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.tag {
  font-size: 10px; font-weight: 700; border-radius: 4px;
  padding: 2px 7px; white-space: nowrap;
}
.tag-t { background: var(--green-soft); color: var(--green); border: 1px solid var(--green-line); }
.tag-y { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-line); }

.vi-note {
  margin-top: 6px; font-size: 12px; color: var(--text-2); line-height: 1.5;
  background: var(--amber-soft); border: 1px solid var(--amber-line);
  border-radius: 6px; padding: 7px 10px;
  grid-column: 1 / -1;
}

.vi-wrap { display: grid; gap: 0; }

/* upload btn */
.upload-bar {
  padding: 10px 14px; border-top: 1px solid var(--line);
}
.upload-bar button {
  width: 100%; padding: 9px; border: 1px dashed var(--amber-line); border-radius: 6px;
  background: var(--amber-soft); color: var(--amber); font-family: inherit;
  font-size: 12px; font-weight: 700; cursor: pointer; display: flex;
  align-items: center; justify-content: center; gap: 6px;
}
.upload-bar button:hover { background: #fff3cd; }

/* ── OVERLAYS ── */
.ov {
  display: none; position: fixed; inset: 0; z-index: 50;
  background: rgba(27,31,35,.65);
  overflow-y: auto; overscroll-behavior: contain;
}
.ov.show { display: block; }
.md {
  background: var(--surface); min-height: 100dvh;
}
.md-head {
  position: sticky; top: 0; z-index: 3;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
}
.md-head h2 { font-size: 15px; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
.md-head .sub { font-size: 11px; color: var(--text-3); font-weight: 500; margin-top: 1px; }
.x-btn {
  background: var(--bg); border: 1px solid var(--line); color: var(--text-2);
  width: 34px; height: 34px; min-width: 34px; border-radius: 6px;
  cursor: pointer; font-size: 15px; display: grid; place-items: center;
  font-family: inherit;
}
.x-btn:hover { background: var(--red-soft); border-color: #fdaeb7; color: var(--red); }
.md-body { padding: 16px; }

/* detail sections */
.ds { margin-bottom: 14px; }
.dl { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 4px; }
.dv { font-size: 14px; line-height: 1.6; }
.dh { background: var(--amber-soft); border: 1px solid var(--amber-line); border-radius: 6px; padding: 12px 14px; }
.dh .dl { color: var(--amber); }
.dh .dv { color: #6b4c00; }
.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.d-box { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.d-box .dval { font-size: 18px; font-weight: 800; color: var(--accent-dark); margin-top: 3px; letter-spacing: -.02em; }
.d-box .dsub { font-size: 11px; color: var(--text-3); }

/* PDF viewer */
#brosOv .md { max-width: 960px; }
.pdf-head {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 2; background: var(--surface);
}
.pdf-head .pt { font-size: 14px; font-weight: 700; }
.pdf-head .ps { font-size: 11px; color: var(--text-3); }
.pdf-tools { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.pdf-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: inherit; font-size: 12px; font-weight: 600;
  color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line);
  border-radius: 5px; padding: 6px 12px; text-decoration: none;
}
.pdf-link:hover { background: #ddeeff; }
.pdf-frame { background: #2f363d; }
.pdf-frame iframe { width: 100%; height: 82vh; border: none; display: block; }
.pdf-fb {
  display: none; padding: 48px 20px; text-align: center; background: var(--bg);
}
.pdf-fb h3 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.pdf-fb p { font-size: 13px; color: var(--text-2); margin-bottom: 16px; }

/* ADMIN */
.adm-bar {
  display: none; background: #fff5b1; border-bottom: 2px solid #f9c513;
  padding: 6px 16px; text-align: center; font-size: 12px; font-weight: 700; color: #735c0f;
}
.adm-bar.show { display: block; }
.adm-bar button {
  background: #e36209; color: #fff; border: none; border-radius: 4px;
  padding: 3px 10px; font-family: inherit; font-weight: 700; font-size: 11px;
  cursor: pointer; margin-left: 6px;
}
#admOv .md { max-width: 560px; }
.af { margin-bottom: 14px; }
.af label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin-bottom: 4px; }
.af input, .af select { width: 100%; font-family: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
.af input:focus, .af select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(3,102,214,.12); }
.af .hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.a-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 10px 20px; font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer; width: 100%;
}
.a-btn:hover { background: var(--accent-dark); }
.a-btn:disabled { opacity: .4; cursor: default; }
.a-ok { background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 6px; padding: 10px 14px; margin-top: 10px; font-size: 12px; color: var(--green); font-weight: 600; display: none; }
.a-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; font-size: 12px; }
.a-item b { font-weight: 700; }
.a-item .as { color: var(--text-3); font-size: 11px; }
.a-del { background: var(--red-soft); color: var(--red); border: 1px solid #fdaeb7; border-radius: 4px; padding: 3px 8px; font-size: 10px; font-weight: 700; cursor: pointer; font-family: inherit; }

/* ── FOOTER ── */
.footer {
  border-top: 1px solid var(--line); padding: 20px 16px; text-align: center;
  font-size: 11px; color: var(--text-3); margin-top: 20px;
}
.footer a { color: var(--accent); text-decoration: none; }

/* ── BRAND GRID ── */
.brand-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-top: 28px; max-width: 480px; margin-left: auto; margin-right: auto;
}
.brand-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px 8px; text-align: center; cursor: pointer;
  box-shadow: var(--shadow-sm); transition: border-color .15s, box-shadow .15s;
}
.brand-card:hover { border-color: var(--accent-line); box-shadow: var(--shadow); }
.brand-card:active { background: var(--surface-hover); }
.brand-card .bc-logo {
  width: 40px; height: 40px; margin: 0 auto 8px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px; overflow: hidden;
}
.brand-card .bc-logo img {
  max-width: 100%; max-height: 100%; object-fit: contain;
}
.brand-card .bc-logo .bc-init {
  width: 40px; height: 40px; border-radius: 8px;
  background: var(--bg); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-size: 14px; font-weight: 800; color: var(--text-2);
}
.brand-card .bc-name { font-size: 11px; font-weight: 700; color: var(--text); }
.brand-card .bc-count { font-size: 10px; color: var(--text-3); margin-top: 1px; }

/* ── MODEL HEADER LOGO ── */
.mh-logo {
  width: 48px; height: 48px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--line);
}
.mh-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.mh-logo .mh-init {
  font-size: 16px; font-weight: 800; color: var(--text-2);
}
.mh-top { display: flex; align-items: center; gap: 14px; }

/* ── RESPONSIVE ── */
@media (min-width: 640px) {
  .main { padding: 24px 20px 100px; }
  .md { min-height: auto; max-width: 520px; margin: 48px auto; border-radius: var(--r-md); box-shadow: var(--shadow-lg); }
  #brosOv .md { max-width: 900px; }
  .ov { padding: 20px; }
}
@media (max-width: 720px) {
  .pdf-frame iframe { display: none; }
  .pdf-fb { display: block; }
}
@media (max-width: 380px) { .sel-bar-inner { grid-template-columns: 1fr; } .brand-grid { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>

<div class="adm-bar" id="admBar">Admin Mode <button onclick="openAdmin()">Kelola Brosur</button> <button onclick="openLogoAdmin()">Upload Logo</button> <button onclick="toggleAdmin()">Tutup</button></div>

let brosurCache = {};
let logoCache = {};

async function loadBrosurData() {
  try { const s = await db.collection("brosur").get(); s.forEach(d => { brosurCache[d.id] = d.data(); }); } catch(e) { console.warn("Firestore brosur:", e.message); }
}
async function loadLogos() {
  try { const s = await db.collection("logos").get(); s.forEach(d => { logoCache[d.id] = d.data().src; }); } catch(e) { console.warn("Firestore logos:", e.message); }
}
function getLogo(merekId) { return logoCache[merekId] || null; }
function getBrosur(m, d, g) { return brosurCache[m + "-" + d + "-" + g.replace(/[^a-zA-Z0-9]/g, "_")] || null; }
function genBros(m, d, units) { for (const u of units) { const b = getBrosur(m, d, u.generasi); if (b) return b; } return null; }

const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
function yr1(t) { const m = String(t).match(/\d{4}/); return m ? +m[0] : 0; }

function getGens(units) {
  const map = new Map();
  units.forEach(u => {
    if (!map.has(u.generasi)) map.set(u.generasi, { nama: u.generasi, perubahan: u.perubahan, units: [], mn: 9999, mx: 0 });
    const g = map.get(u.generasi); g.units.push(u);
    const t = yr1(u.tahun); if (t && t < g.mn) g.mn = t; if (t && t > g.mx) g.mx = t;
  });
  return [...map.values()].sort((a, b) => a.mn - b.mn);
}
function grpV(units) {
  const map = new Map();
  units.forEach(u => {
    const k = [u.tipe_unit, u.tahun, u.generasi, u.perubahan, u.catatan].join("\0");
    if (!map.has(k)) map.set(k, { ...u, trs: [] });
    const g = map.get(k);
    if (u.transmisi && u.transmisi !== "-" && !g.trs.includes(u.transmisi)) g.trs.push(u.transmisi);
  });
  return [...map.values()];
}

function buildCdMenu() {

      const logoH = logo ? '<div class="cd-o-logo"><img src="' + logo + '"></div>' : '<div class="cd-o-init">' + esc(m.nama.substring(0,2).toUpperCase()) + '</div>';
      return '<div class="cd-opt" data-val="' + m.id + '">' + logoH + '<div class="cd-o-name">' + esc(m.nama) + '</div><div class="cd-o-count">' + m.model.length + ' model</div></div>';
    }).join("");
  cdMenu.querySelectorAll(".cd-opt").forEach(opt => {
    opt.onclick = (e) => { e.stopPropagation(); selectMerek(opt.dataset.val); closeCd(); };
  });

function updateCdTrigger() {
  const mk = MEREK_LIST.find(m => m.id === mSel.value);
  if (!mk) { cdTrigger.innerHTML = '<span class="cd-ph">Pilih merek</span>'; return; }
  const logo = getLogo(mk.id);
  const logoH = logo ? '<div class="cd-logo"><img src="' + logo + '"></div>' : '';
  cdTrigger.innerHTML = logoH + '<span>' + esc(mk.nama) + ' (' + mk.model.length + ')</span>';

  cdMenu.querySelectorAll(".cd-opt").forEach(o => o.classList.toggle("active", o.dataset.val === mk.id));
}

cdTrigger.onclick = (e) => { e.stopPropagation(); if (cdOpen) closeCd(); else openCd(); };
function openCd() { cdOpen = true; cdMenu.classList.add("show"); cdTrigger.classList.add("open"); }
function closeCd() { cdOpen = false; cdMenu.classList.remove("show"); cdTrigger.classList.remove("open"); }

}

function renderTL(mk, md, gens, q) {
  const tl = $("timeline"); tl.innerHTML = ""; let vis = 0;
  gens.forEach((gen, i) => {
    let vars = grpV(gen.units);
    if (q) { const ql = q.toLowerCase(); vars = vars.filter(v => ql.split(/\s+/).every(k => [v.tipe_unit, v.trs.join(" "), v.tahun, v.generasi, v.perubahan, v.catatan].join(" ").toLowerCase().includes(k))); if (!vars.length) return; }
    vis++;
    const bros = genBros(mk.id, md.id, gen.units);
    const yr = gen.mn + (gen.mx !== gen.mn ? "\u2013" + gen.mx : "") + (gen.units.some(u => u.tahun.includes("sekarang")) ? "+" : "");
    let desc = esc(gen.perubahan);

    const pdfSvg = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 1h6l4 4v9a1 1 0 01-1 1H4a1 1 0 01-1-1V2a1 1 0 011-1z" stroke="currentColor" stroke-width="1.5"/><path d="M10 1v4h4" stroke="currentColor" stroke-width="1.5"/></svg>';
    if (bros) desc += '<button type="button" class="pdf-btn" data-bg="1">' + pdfSvg + '<span><span class="pt">' + esc(bros.judul) + '</span><span class="ps">Buka brosur PDF</span></span></button>';

    let upHTML = '';
    if (isAdmin && !bros) upHTML = '<div class="upload-bar"><button type="button" data-upload="1">+ Tambah Brosur PDF</button></div>';

    const sec = document.createElement("div"); sec.className = "tl-section";
    sec.innerHTML =
      '<div class="tl-block"><div class="tl-dot off"></div><div class="tl-card"><div class="tl-head"><div class="tl-info"><div class="tl-name">' + esc(gen.nama) + '</div><div class="tl-yr">' + esc(yr) + '</div></div><div class="tl-tags">' +
      (bros ? '<span class="tl-tag doc">PDF</span>' : '') +
      (isAdmin && !bros ? '<span class="tl-tag adm" data-ub="1">+ PDF</span>' : '') +
      '<span class="tl-tag">' + vars.length + ' varian</span></div><span class="tl-arr">\u25BC</span></div>' +
      '<div class="tl-desc">' + desc + '</div>' +
      '<div class="tl-body">' +
      vars.map((v, vi) => {
        const hasNote = v.catatan && v.catatan.trim();
        return '<div class="vi-wrap"><div class="vi" data-vi="' + vi + '"><div class="vi-name">' + esc(v.tipe_unit) + '</div><div class="vi-tags">' +
          v.trs.map(t => '<span class="tag tag-t">' + esc(t) + '</span>').join("") +
          '<span class="tag tag-y">' + esc(v.tahun) + '</span></div></div>' +
          (hasNote ? '<div class="vi-note" style="margin:0 14px 8px">' + esc(v.catatan) + '</div>' : '') + '</div>';
      }).join("") +
      upHTML + '</div></div></div>';

    const head = sec.querySelector(".tl-head"), card = sec.querySelector(".tl-card"), dot = sec.querySelector(".tl-dot");
    head.onclick = (e) => {
      if (e.target.closest("[data-ub]")) return;
      card.classList.toggle("open"); dot.classList.toggle("off", !card.classList.contains("open"));
    };
    const bb = sec.querySelector("[data-bg]"); if (bb && bros) bb.onclick = e => { e.stopPropagation(); openPDF(bros); };
    const ubB = sec.querySelector("[data-ub]"); if (ubB) ubB.onclick = e => { e.stopPropagation(); openAdmGen(mk.id, md.id, gen.nama); };
    const ub = sec.querySelector("[data-upload]"); if (ub) ub.onclick = e => { e.stopPropagation(); openAdmGen(mk.id, md.id, gen.nama); };
    sec.querySelectorAll("[data-vi]").forEach(el => { el.onclick = () => { const vi = parseInt(el.dataset.vi, 10); if (vars[vi]) openDet(mk, md, vars[vi]); }; });
    tl.appendChild(sec);
  });
  if (!vis) tl.innerHTML = '<div class="welcome" style="padding:40px 20px"><h2>Tidak ditemukan</h2><p>Coba kata kunci lain</p></div>';
}

let st; $("searchInput").addEventListener("input", e => { clearTimeout(st); st = setTimeout(() => { const mk = MEREK_LIST.find(m => m.id === mSel.value), md = mk?.model.find(m => m.id === dSel.value); if (mk && md) renderTL(mk, md, getGens(md.unit), e.target.value.trim()); }, 180); });

    '<div class="md-body"><div class="d-grid"><div class="d-box"><div class="dl">Tahun Edar</div><div class="dval">' + esc(String(v.tahun).split("-")[0]) + '</div><div class="dsub">' + esc(v.tahun) + '</div></div>' +

/* Admin */
let isAdmin = false;
const ADMIN_PASS = "nasigoreng97";
function toggleAdmin() {
  if (!isAdmin) {
    const pw = prompt("Masukkan password admin:");
    if (pw !== ADMIN_PASS) { if (pw !== null) alert("Password salah"); return; }
  }
  isAdmin = !isAdmin; $("admBar").classList.toggle("show", isAdmin);
  $("admToggle").classList.toggle("on", isAdmin);
  $("admToggle").textContent = isAdmin ? "Admin ✓" : "Admin";
  if (dSel.value) renderModel();
}
function openAdmin() { openAdmGen("", "", ""); }
function openAdmGen(mi, di, gn) {
  let mO = '<option value="">Pilih merek</option>';
  MEREK_LIST.forEach(m => mO += '<option value="' + m.id + '"' + (m.id === mi ? ' selected' : '') + '>' + esc(m.nama) + '</option>');
  $("admMd").innerHTML =
    '<div class="md-head"><div><h2>Tambah Brosur</h2><div class="sub">Hubungkan file PDF ke generasi</div></div><button class="x-btn" id="xAdm">\u2715</button></div><div class="md-body">' +
    '<div class="af"><label>Merek</label><select id="aM">' + mO + '</select></div>' +
    '<div class="af"><label>Model</label><select id="aD" disabled><option value="">Pilih model</option></select></div>' +
    '<div class="af"><label>Generasi</label><select id="aG" disabled><option value="">Pilih generasi</option></select></div>' +
    '<div class="af"><label>Judul</label><input id="aJ" placeholder="Brosur New Honda Brio 2023"></div>' +
    '<div class="af"><label>Nama File PDF</label><input id="aP" placeholder="Honda-Brio-2023-ID.pdf"><div class="hint">Nama harus <b>persis sama</b> dengan file di GitHub (huruf besar/kecil)</div></div>' +
    '<button class="a-btn" id="aSub" disabled>Simpan</button><div class="a-ok" id="aOk"></div>' +
    '<div id="aList" style="margin-top:20px"></div></div>';
  $("xAdm").onclick = () => closeOv("admOv");
  const aM = $("aM"), aD = $("aD"), aG = $("aG");
  aM.onchange = () => {
    const mk = MEREK_LIST.find(m => m.id === aM.value);
    aD.innerHTML = '<option value="">Pilih model</option>'; aD.disabled = !mk;
    aG.innerHTML = '<option value="">Pilih generasi</option>'; aG.disabled = true;
    if (mk) mk.model.forEach(md => { const o = document.createElement("option"); o.value = md.id; o.textContent = md.nama; aD.appendChild(o); });
    chk();
  };
  aD.onchange = () => {
    const mk = MEREK_LIST.find(m => m.id === aM.value), md = mk?.model.find(m => m.id === aD.value);
    aG.innerHTML = '<option value="">Pilih generasi</option>'; aG.disabled = !md;
    if (md) getGens(md.unit).forEach(g => { const o = document.createElement("option"); o.value = g.nama; o.textContent = g.nama; aG.appendChild(o); });
    chk();
  };
  aG.onchange = chk; $("aP").oninput = chk;
  if (mi) { aM.value = mi; aM.onchange(); if (di) { aD.value = di; aD.onchange(); } if (gn) { aG.value = gn; } chk(); }
  function chk() { $("aSub").disabled = !aM.value || !aD.value || !aG.value || !$("aP").value.trim(); }
  $("aSub").onclick = async () => {
    const mkId = aM.value, mdId = aD.value, gN = aG.value, judul = $("aJ").value.trim() || ("Brosur " + gN);
    const pdfPath = $("aP").value.trim(), docId = mkId + "-" + mdId + "-" + gN.replace(/[^a-zA-Z0-9]/g, "_");
    $("aSub").disabled = true;
    try {
      await db.collection("brosur").doc(docId).set({ merek: mkId, model: mdId, generasi: gN, judul, pdfPath, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      brosurCache[docId] = { merek: mkId, model: mdId, generasi: gN, judul, pdfPath };
      $("aOk").style.display = "block"; $("aOk").textContent = "\u2705 Tersimpan! " + judul;
      $("aP").value = ""; if (mSel.value === mkId && dSel.value === mdId) renderModel(); loadAL();
    } catch (e) { $("aOk").style.display = "block"; $("aOk").textContent = "\u274C " + e.message; $("aOk").style.background = "var(--red-soft)"; $("aOk").style.color = "var(--red)"; }
    $("aSub").disabled = false;
  };
  loadAL(); openOv("admOv");
}
function loadAL() {
  const l = $("aList"); if (!l) return;
  const it = Object.entries(brosurCache);
  if (!it.length) { l.innerHTML = '<p style="font-size:12px;color:var(--text-3);text-align:center;padding:10px">Belum ada brosur</p>'; return; }
  l.innerHTML = '<div class="dl" style="margin-bottom:6px">Brosur terdaftar</div>' + it.map(([id, b]) => '<div class="a-item"><div><b>' + esc(b.judul) + '</b><div class="as">' + esc(b.pdfPath || '-') + '</div></div><button class="a-del" data-del="' + id + '">Hapus</button></div>').join("");
  l.querySelectorAll("[data-del]").forEach(btn => { btn.onclick = async () => { if (!confirm("Hapus?")) return; try { await db.collection("brosur").doc(btn.dataset.del).delete(); delete brosurCache[btn.dataset.del]; loadAL(); if (dSel.value) renderModel(); } catch(e) { alert(e.message); } }; });
}

/* Logo Admin */
function openLogoAdmin() {
  $("admMd").innerHTML =
    '<div class="md-head"><div><h2>Upload Logo Merek</h2><div class="sub">Logo akan tersimpan di Firestore</div></div><button class="x-btn" id="xLogo">\u2715</button></div><div class="md-body">' +
    '<div class="af"><label>Pilih Merek</label><select id="lMerek"><option value="">Pilih merek</option>' +
    MEREK_LIST.map(m => '<option value="' + m.id + '">' + esc(m.nama) + (getLogo(m.id) ? ' \u2713' : '') + '</option>').join("") +
    '</select></div>' +
    '<div class="af"><label>File Logo (PNG/JPG, akan di-resize 120px)</label>' +
    '<input type="file" id="lFile" accept="image/*" style="font-size:13px"></div>' +
    '<div id="lPreview" style="margin-bottom:14px"></div>' +
    '<button class="a-btn" id="lSub" disabled>Upload Logo</button>' +
    '<div class="a-ok" id="lOk"></div>' +
    '<div id="lList" style="margin-top:20px"></div></div>';
  $("xLogo").onclick = () => closeOv("admOv");
  $("lMerek").onchange = () => { $("lSub").disabled = !$("lMerek").value || !$("lFile").files.length; };
  $("lFile").onchange = () => {
    $("lSub").disabled = !$("lMerek").value || !$("lFile").files.length;
    if ($("lFile").files[0]) {
      const url = URL.createObjectURL($("lFile").files[0]);
      $("lPreview").innerHTML = '<div style="width:80px;height:80px;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--bg)"><img src="' + url + '" style="max-width:100%;max-height:100%;object-fit:contain"></div>';
    }
  };
  $("lSub").onclick = async () => {
    const merekId = $("lMerek").value, file = $("lFile").files[0];
    if (!merekId || !file) return;
    $("lSub").disabled = true;
    try {
      const b64 = await compressLogo(file, 120);
      await db.collection("logos").doc(merekId).set({ src: b64, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      logoCache[merekId] = b64;
      $("lOk").style.display = "block"; $("lOk").textContent = "\u2705 Logo " + merekId + " tersimpan!";
      renderBrandGrid();
      renderLogoList();
    } catch(e) { $("lOk").style.display = "block"; $("lOk").textContent = "\u274C " + e.message; $("lOk").style.background = "var(--red-soft)"; $("lOk").style.color = "var(--red)"; }
    $("lSub").disabled = false;
  };
  renderLogoList();
  openOv("admOv");
}

function renderLogoList() {
  const l = $("lList"); if (!l) return;
  const items = Object.entries(logoCache);
  if (!items.length) { l.innerHTML = '<p style="font-size:12px;color:var(--text-3);text-align:center">Belum ada logo</p>'; return; }
  l.innerHTML = '<div class="dl" style="margin-bottom:6px">Logo terdaftar</div>' +
    items.map(([id, src]) => '<div class="a-item"><div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;border-radius:6px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg)"><img src="' + src + '" style="max-width:100%;max-height:100%;object-fit:contain"></div><b>' + esc(id) + '</b></div><button class="a-del" data-ldel="' + id + '">Hapus</button></div>').join("");
  l.querySelectorAll("[data-ldel]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Hapus logo " + btn.dataset.ldel + "?")) return;
      try { await db.collection("logos").doc(btn.dataset.ldel).delete(); delete logoCache[btn.dataset.ldel]; renderLogoList(); renderBrandGrid(); } catch(e) { alert(e.message); }
    };
  });
}

function compressLogo(file, maxSize) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
      else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL("image/png", 0.9));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* Overlays */
let lf = null;
function openOv(id) { lf = document.activeElement; $(id).classList.add("show"); document.body.classList.add("no-scroll"); }
function closeOv(id) { $(id).classList.remove("show"); if (!document.querySelector(".ov.show")) document.body.classList.remove("no-scroll"); if (lf && document.contains(lf)) lf.focus(); }
["detOv", "brosOv", "admOv"].forEach(id => { $(id).addEventListener("mousedown", e => { if (e.target === e.currentTarget) closeOv(id); }); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const o = document.querySelector(".ov.show"); if (o) closeOv(o.id); } });

/* Hash */
let ih = false;
function updateHash() { if (!mSel.value) { if (location.hash) { ih = true; location.hash = ""; setTimeout(() => ih = false, 0); } return; } const h = mSel.value + (dSel.value ? "/" + dSel.value : ""); if (location.hash.replace(/^#/, "") === h) return; ih = true; location.hash = h; setTimeout(() => ih = false, 0); }
function readHash() { const h = location.hash.replace(/^#/, ""); if (!h) return false; const [m, d] = h.split("/"); if (!m) return false; mSel.value = m; mSel.onchange(); if (d) { dSel.value = d; renderModel(); } return true; }
window.addEventListener("hashchange", () => { if (!ih) readHash(); });

Promise.all([loadBrosurData(), loadLogos()]).then(() => { renderBrandGrid(); readHash(); });
